<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>살림특가연구소 | 오늘의 살림 핫딜</title>
<style>
:root{--ink:#27211e;--muted:#827770;--line:#ece5df;--accent:#d64c60;--brown:#765747;--bg:#fffdfa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif}button,input{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}.wrap{max-width:1120px;margin:auto;padding:22px 24px 50px}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:8px 0 22px}.brand{font-size:22px;font-weight:850;letter-spacing:-.8px;color:var(--brown)}.top-note{font-size:12px;color:var(--muted)}.hero{border:1px solid var(--line);border-radius:18px;padding:32px 20px 28px;text-align:center;background:#fff}.hero h1{font-size:clamp(24px,3.4vw,34px);letter-spacing:-1.2px;margin:0 0 9px}.hero p{color:var(--muted);font-size:13px;margin:0 0 22px;line-height:1.7}.search-wrap{display:flex;align-items:center;gap:9px;max-width:470px;margin:auto;border:1px solid #e7dfda;background:#faf8f7;border-radius:12px;padding:4px 5px 4px 15px}.search-wrap input{border:0;outline:0;background:transparent;min-width:0;flex:1;padding:10px 0;color:var(--ink)}.search-wrap button{border:0;background:var(--brown);color:white;border-radius:9px;padding:10px 18px;font-weight:700}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:30px 0 12px}.toolbar h2{margin:0;font-size:22px;letter-spacing:-.6px}.count{font-size:13px;color:var(--muted);margin-top:5px}.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.controls select{background:white;border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:#554b45;max-width:180px}.deals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 28px}.deal{display:grid;grid-template-columns:168px minmax(0,1fr);gap:17px;align-items:center;padding:19px 0;border-bottom:1px solid var(--line);min-width:0}.photo{width:168px;aspect-ratio:1;background:#f8f5f1;border-radius:12px;display:grid;place-items:center;overflow:hidden}.photo img{display:block;width:100%;height:100%;object-fit:contain;background:white}.photo .fallback{font-size:48px}.detail{min-width:0}.mall{color:#8b7d74;font-size:12px;margin-bottom:6px}.name{font-size:15px;line-height:1.5;font-weight:650;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.old{font-size:12px;text-decoration:line-through;color:#a59a93;margin-top:10px;min-height:16px}.pricing{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}.discount{color:#e23d55;font-size:17px;font-weight:850}.price{font-size:22px;font-weight:850;letter-spacing:-.7px}.tags{display:flex;gap:5px;margin-top:9px;flex-wrap:wrap}.tag{font-size:11px;padding:4px 7px;background:#fff0f2;color:#c8455b;border-radius:5px}.go{display:inline-flex;margin-top:11px;font-size:12px;font-weight:700;color:var(--brown);border-bottom:1px solid var(--brown);padding-bottom:2px}.empty{grid-column:1/-1;text-align:center;padding:65px 15px;color:var(--muted);border-bottom:1px solid var(--line)}.disclaimer{margin-top:32px;border-top:1px solid var(--line);padding-top:18px;color:#8b8079;font-size:12px;line-height:1.9}footer{margin-top:20px;font-size:12px;color:#a29690}a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--brown);outline-offset:3px}@media(max-width:900px){.deals{grid-template-columns:1fr}.deal{grid-template-columns:155px minmax(0,1fr)}.photo{width:155px}}@media(max-width:520px){.wrap{padding:14px 15px 35px}.brand{font-size:19px}.top-note{display:none}.hero{padding:26px 14px}.toolbar{margin-top:24px}.controls{width:100%}.controls select{flex:1;max-width:none;min-width:0}.deal{grid-template-columns:118px minmax(0,1fr);gap:12px;padding:15px 0}.photo{width:118px}.name{font-size:13px}.price{font-size:19px}.discount{font-size:15px}.go{font-size:11px}.old{margin-top:6px}}
</style></head><body><main class="wrap"><header class="top"><div class="brand">⌂ 살림특가연구소</div><div class="top-note">살림에 필요한 할인 정보만 한눈에</div></header><section class="hero"><h1>🔥 오늘 뭐 떴어? 살림 핫딜</h1><p>여러 쇼핑몰의 살림 특가를 모아봤어요.<br>상품 가격과 재고는 판매처에서 최종 확인해 주세요.</p><form class="search-wrap" id="searchForm"><span aria-hidden="true">⌕</span><input id="search" aria-label="상품 검색" placeholder="찾는 살림 상품을 검색해 보세요"><button type="submit">검색</button></form></section><div class="toolbar"><div><h2>⏰ 오늘의 특가</h2><div class="count" id="status" role="status">특가 상품을 불러오는 중이에요…</div></div><div class="controls"><select id="category" aria-label="카테고리"><option value="전체">전체 카테고리</option><option>주방</option><option>청소</option><option>수납</option><option>욕실</option><option>가전</option><option>반려동물</option><option>인테리어</option></select><select id="sort" aria-label="정렬"><option value="discount">할인율 높은 순</option><option value="low">가격 낮은 순</option><option value="high">가격 높은 순</option></select></div></div><section class="deals" id="deals" aria-label="특가 상품 목록"><div class="empty">상품을 불러오는 중이에요…</div></section><div class="disclaimer">이 사이트에는 쿠팡 파트너스 제휴 링크가 포함될 수 있으며 구매 시 운영자가 수수료를 받을 수 있습니다.<br>할인율은 제공된 정상가와 판매가를 기준으로 계산하며, 실제 최저가를 보장하지 않습니다. 판매처에서 최종 가격, 옵션, 배송비 및 재고를 확인해 주세요.</div><footer>© 살림특가연구소</footer></main>
<script>
const $=id=>document.getElementById(id);
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=value=>Number(value).toLocaleString('ko-KR')+'원';
let products=[];let loaded=false;function isCoupang(url){try{const h=new URL(url).hostname;return /(^|\.)(coupang\.com|coupa\.ng)$/i.test(h)}catch{return false}}
function render(){
 const query=$('search').value.trim().toLocaleLowerCase('ko');const category=$('category').value;
 let shown=products.filter(p=>(category==='전체'||p.category===category)&&p.name.toLocaleLowerCase('ko').includes(query));
 const sort=$('sort').value;shown.sort((a,b)=>sort==='low'?a.price-b.price:sort==='high'?b.price-a.price:b.discountRate-a.discountRate||a.price-b.price);
 $('status').textContent=loaded?`현재 ${shown.length}개 상품 표시 · 직접 등록한 쿠팡 상품`:'특가 상품을 불러오는 중이에요…';
 $('deals').innerHTML=shown.length?shown.map(p=>`<article class="deal"><a class="photo" href="${esc(p.url)}" target="_blank" rel="noopener noreferrer sponsored" aria-label="${esc(p.name)} 상품 보기">${p.image?`<img src="${esc(p.image)}" alt="${esc(p.name)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display='none'">`:`<span class="fallback">🏠</span>`}</a><div class="detail"><div class="mall">${esc(p.mall||p.category)}</div><a class="name" href="${esc(p.url)}" target="_blank" rel="noopener noreferrer sponsored">${esc(p.name)}</a><div class="old">${p.originalPrice>p.price?money(p.originalPrice):''}</div><div class="pricing">${p.discountRate>0?`<span class="discount">${p.discountRate}%</span>`:''}<span class="price">${money(p.price)}</span></div><div class="tags"><span class="tag">${esc(p.category)} 특가</span>${p.discountRate>=30?'<span class="tag">할인 상품</span>':''}</div><a class="go" href="${esc(p.url)}" target="_blank" rel="noopener noreferrer sponsored">상품 보러 가기 ↗</a></div></article>`).join(''):`<div class="empty">${loaded?'현재 조건에 맞는 특가 상품이 없어요.':'상품을 불러오는 중이에요…'}</div>`;
}
async function load(){try{const response=await fetch('./products.json',{cache:'no-store'});if(!response.ok)throw new Error('HTTP '+response.status);const data=await response.json();if(!Array.isArray(data.products))throw new Error('Invalid products');products=data.products.filter(p=>p&&typeof p.name==='string'&&typeof p.category==='string'&&Number.isFinite(p.price)&&p.price>0&&typeof p.url==='string'&&/^https:\/\//i.test(p.url)&&isCoupang(p.url)).map(p=>({name:p.name,category:p.category,price:p.price,originalPrice:Number(p.originalPrice)||0,discountRate:Number.isFinite(p.discountRate)?p.discountRate:(p.originalPrice>p.price?Math.round((1-p.price/p.originalPrice)*100):0),image:typeof p.image==='string'&&/^https:\/\//i.test(p.image)?p.image:'',mall:'쿠팡',url:p.url}));loaded=true;render()}catch(e){console.error('특가 불러오기 실패',e);loaded=true;render();$('status').textContent='특가 정보를 잠시 불러올 수 없어요. 잠시 후 다시 시도해 주세요.'}}
$('search').addEventListener('input',render);$('searchForm').addEventListener('submit',e=>{e.preventDefault();render();$('deals').scrollIntoView({behavior:'smooth'})});$('category').addEventListener('change',render);$('sort').addEventListener('change',render);load();
</script></body></html>
