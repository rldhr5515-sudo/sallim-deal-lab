<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>쿠팡 특가 등록</title><style>body{font-family:system-ui,sans-serif;background:#fffaf7;color:#342720;margin:0}main{max-width:680px;margin:30px auto;padding:0 18px}section{background:#fff;border:1px solid #e9ddd5;border-radius:16px;padding:22px;margin:20px 0}label{display:block;margin:14px 0 5px;font-weight:700}input,select{width:100%;padding:12px;border:1px solid #d9cfc7;border-radius:9px;box-sizing:border-box;font:inherit}button{background:#765747;color:white;border:0;border-radius:9px;padding:12px 16px;margin:12px 6px 0 0;cursor:pointer;font-weight:700}.light{background:#eee6e0;color:#342720}p,small{line-height:1.7;color:#76675f}.item{border-top:1px solid #eee;padding:10px 0;display:flex;align-items:center;gap:8px}.item span{flex:1}#msg{color:#a23b4a}</style></head><body><main><a href="./index.html">← 사이트 보기</a><h1>🛒 쿠팡 특가 간편 등록</h1><p>쿠팡에서 찾은 상품을 직접 입력해. 표시 할인율 50% 이상만 등록할 수 있어. 링크만으로 가격이나 사진을 자동 수집하지는 않아.</p><section><form id="form"><label>상품명 *</label><input id="name" required placeholder="예: 주방세제 1L 3개"><label>카테고리</label><select id="category"><option>청소</option><option>주방</option><option>수납</option><option>욕실</option><option>가전</option><option>반려동물</option><option>인테리어</option></select><label>정상가 (원) *</label><input id="originalPrice" type="number" min="1" required><label>특가 (원) *</label><input id="price" type="number" min="1" required><p id="rate">할인율: 0%</p><label>상품 이미지 주소 (선택)</label><input id="image" type="url" placeholder="https://..."><label>쿠팡 구매 링크 *</label><input id="url" type="url" required placeholder="https://link.coupang.com/..."><button type="submit">+ 상품 추가</button><button type="reset" class="light">초기화</button></form></section><section><h2>등록 목록 <span id="count">0개</span></h2><div id="items"></div><button id="download">① products.json 다운로드</button><button id="refresh" class="light">공개 목록 다시 불러오기</button><p><strong>② GitHub에서 products.json 교체 → Commit changes</strong>를 눌러야 실제 방문자에게 보여. 이 화면에서 추가만 하면 공개되지 않아.</p><small>입력 내용은 현재 브라우저에 임시 보관돼. 다른 기기와 자동 동기화되지 않아.</small><p id="msg"></p></section></main><script>
const $=id=>document.getElementById(id),key='sallim_manual_coupang_v1';let products=[];function host(url){try{let u=new URL(url);return u.protocol==='https:'&&/(^|\.)(coupang\.com|coupa\.ng)$/i.test(u.hostname)}catch{return false}}function rate(){let o=+$('originalPrice').value,p=+$('price').value;return o>p&&p>0?Math.round((1-p/o)*100):0}function save(){localStorage.setItem(key,JSON.stringify(products))}function render(){$('count').textContent=products.length+'개';$('items').replaceChildren();products.forEach((p,i)=>{let d=document.createElement('div'),s=document.createElement('span'),b=document.createElement('button');d.className='item';s.textContent=p.name+' · '+p.discountRate+'% · '+p.price.toLocaleString()+'원';b.textContent='삭제';b.onclick=()=>{products.splice(i,1);save();render()};d.append(s,b);$('items').append(d)})}['price','originalPrice'].forEach(id=>$(id).addEventListener('input',()=>{$('rate').textContent='할인율: '+rate()+'%'}));$('form').onsubmit=e=>{e.preventDefault();if(rate()<50){alert('50% 이상 할인 상품만 등록할 수 있어.');return}if(!host($('url').value)){alert('쿠팡 링크만 등록할 수 있어.');return}let p={name:$('name').value.trim(),category:$('category').value,originalPrice:+$('originalPrice').value,price:+$('price').value,discountRate:rate(),image:$('image').value.trim(),mall:'쿠팡',url:$('url').value.trim(),addedAt:new Date().toISOString()};if(products.some(x=>x.url===p.url)){alert('같은 링크가 이미 있어.');return}products.unshift(p);save();render();$('form').reset();$('rate').textContent='할인율: 0%';$('msg').textContent='추가 완료! JSON을 다운로드해 GitHub에 업로드해야 공개돼.'};$('download').onclick=()=>{let blob=new Blob([JSON.stringify({products,updatedAt:new Date().toISOString()},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='products.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};async function load(){try{let r=await fetch('./products.json',{cache:'no-store'}),d=await r.json();if(!Array.isArray(d.products))throw Error('invalid');let draft=JSON.parse(localStorage.getItem(key)||'[]');products=draft.length?draft:d.products;save();render()}catch{try{products=JSON.parse(localStorage.getItem(key)||'[]')}catch{products=[]}render();$('msg').textContent='공개 목록을 불러오지 못했어. 임시 저장 목록을 표시해.'}}$('refresh').onclick=()=>{if(confirm('임시 목록을 지우고 공개된 목록을 다시 불러올까?')){localStorage.removeItem(key);load()}};load();
</script></body></html>
